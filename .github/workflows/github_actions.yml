# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Every day at 2am 
  schedule:
    - cron: '0 2 * * *'

  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job then deploy
  build:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
            dotnet-version: 10.0.x
      
      - name: Add vitepress
        run: |
          cd TateEmails/vite-template
          npm add -D vitepress
      
      - name: Install npm dependencies
        run: |
          cd TateEmails/vite-template
          npm install 
          cd ../.. 

      - name: Generate Html files
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          USER_EMAIL: ${{ secrets.USER_EMAIL }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
            cd TateEmails/
            dotnet run

      - name: Add google index file
        run: |
            echo "google-site-verification: googleca373f3ecd11517e.html" > ./TateEmails/vite-template/.vitepress/dist/googleca373f3ecd11517e.html

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Upload entire repository
          path: './TateEmails/vite-template/.vitepress/dist/'
      

  # Deploy job that will be run after build
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

 